<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Memory - Carregar Partida</title>
    <script src="../js/load.js" type="module"></script>
    <style>
        body { background-color: #222; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .load-container { background-color: #333; padding: 30px; border-radius: 10px; width: 600px; text-align: center; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #555; text-align: center; }
        .btn-load { background-color: #4CAF50; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .btn-back { background-color: #555; color: white; border: none; padding: 10px; width: 100%; margin-top: 20px; border-radius: 5px; cursor: pointer; }
        tr:hover { background-color: #444; }
    </style>
</head>
<body>
    <div class="load-container">
        <h1>Partides Guardades</h1>
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Nivell</th>
                    <th>Punts</th>
                    <th>Acció</th>
                </tr>
            </thead>
            <tbody id="load-body">
                </tbody>
        </table>
        <button id="back-menu" class="btn-back">Tornar al Menú</button>
    </div>
</body>
</html>
